<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A look styled with ILVIO</title>
  <meta name="robots" content="noindex">
  <meta property="og:title" content="A look styled with ILVIO">
  <meta property="og:description" content="An AI try-on look created with ILVIO.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200;6..72,300;6..72,400&family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .share-wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; text-align: center; }
    .share-figure { margin: 0 auto 26px; max-width: 480px; }
    .share-figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .16);
      background: rgba(0, 0, 0, .04);
    }
    .share-tag {
      font-family: "Newsreader", Georgia, serif;
      font-weight: 300;
      font-size: 1.35rem;
      letter-spacing: .04em;
      margin: 0 0 8px;
    }
    .share-tag b { font-weight: 400; letter-spacing: .18em; }
    .share-sub { opacity: .6; font-size: .95rem; margin: 0 auto 26px; max-width: 28em; }
    .share-status { opacity: .6; font-size: 1.0625rem; padding: 60px 0; }
    .share-hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">ILVIO</a>
    <nav>
      <a href="/plans/">Plans</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </header>

  <div class="share-wrap">
    <p class="share-status" id="status">Loading look…</p>

    <div id="content" class="share-hidden">
      <figure class="share-figure">
        <img id="look" alt="A try-on look styled with ILVIO">
      </figure>
      <p class="share-tag">Styled with <b>ILVIO</b></p>
      <p class="share-sub">AI-powered outfit try-ons. See how any look fits you before you wear it.</p>
      <a class="btn btn--solid" href="https://ilvio.eu/">Discover ILVIO</a>
    </div>
  </div>

  <footer class="site-footer">
    <nav>
      <a href="/plans/">Plans</a>
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
      <a href="/delete-account/">Delete account</a>
    </nav>
    <p>© 2026 ILVIO OÜ · Järve 35A, 11314 Tallinn, Estonia · Registrikood 17333912 · <a href="mailto:info@ilvio.eu">info@ilvio.eu</a></p>
  </footer>

  <script>
    (function () {
      var ENDPOINT = "https://zvnzckckdfwqkiqbjcaj.supabase.co/functions/v1/share-link";
      var statusEl = document.getElementById("status");
      var contentEl = document.getElementById("content");
      var imgEl = document.getElementById("look");

      function fail(msg) {
        statusEl.textContent = msg;
        statusEl.classList.remove("share-hidden");
        contentEl.classList.add("share-hidden");
      }

      var params = new URLSearchParams(window.location.search);
      var id = (params.get("id") || "").trim();

      if (!id || !/^[0-9A-Za-z]{1,32}$/.test(id)) {
        fail("This share link looks incomplete. Ask for a fresh link from the ILVIO app.");
        return;
      }

      fetch(ENDPOINT + "?id=" + encodeURIComponent(id))
        .then(function (res) {
          if (res.status === 404) throw new Error("notfound");
          if (!res.ok) throw new Error("http");
          return res.json();
        })
        .then(function (data) {
          if (!data || !data.url) throw new Error("nourl");
          imgEl.onload = function () {
            statusEl.classList.add("share-hidden");
            contentEl.classList.remove("share-hidden");
          };
          imgEl.onerror = function () {
            fail("This look isn't available right now. The link may have expired.");
          };
          imgEl.src = data.url;
        })
        .catch(function (err) {
          if (err && err.message === "notfound") {
            fail("We couldn't find that look. The link may be invalid or removed.");
          } else {
            fail("Something went wrong loading this look. Please try again later.");
          }
        });
    })();
  </script>
</body>
</html>
